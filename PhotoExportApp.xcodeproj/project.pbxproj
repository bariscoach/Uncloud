			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "set -eu\nSRC=\"$SRCROOT/Vendor/icloudpd-runtime\"\nDEST=\"$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/icloudpd-runtime\"\nIDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY:--}\"\n# Hardened runtime only with a real identity: Python loads its own extension modules,\n# and ad hoc signatures have no team ID for library validation to match.\nRUNTIME=\"\"\nif [ \"$IDENTITY\" != \"-\" ]; then RUNTIME=\"--options runtime\"; fi\nif [ ! -f \"$SRC/.stamp\" ]; then\n    echo \"error: $SRC is missing; run scripts/build-icloudpd.sh\" >&2\n    exit 1\nfi\nmkdir -p \"$DEST\"\nrsync -a --delete --exclude .stamp \"$SRC/\" \"$DEST/\"\n# The app's own bridge to pyicloud_ipd runs next to run_icloudpd.py. It's a plain\n# resource, sealed by the app's signature like the rest of the runtime's Python files.\ncp \"$SRCROOT/PhotoExportApp/Helper/photo_bridge.py\" \"$DEST/photo_bridge.py\"\nINTERPRETER=\"$DEST/python/bin/python3.13\"\n# Sign the libraries and extension modules first, then the interpreter. Only the\n# interpreter is launched, so only it gets the inherit-the-app's-sandbox entitlements.\nfind \"$DEST\" -type f ! -path \"$INTERPRETER\" -print0 | while IFS= read -r -d '' f; do\n    if file -b \"$f\" | grep -q '^Mach-O'; then\n        codesign --force --timestamp=none $RUNTIME -s \"$IDENTITY\" \"$f\"\n    fi\ndone\ncodesign --force --timestamp=none $RUNTIME -s \"$IDENTITY\" \\\n    --entitlements \"$SRCROOT/PhotoExportApp/Helper.entitlements\" \"$INTERPRETER\"\n";
		};
