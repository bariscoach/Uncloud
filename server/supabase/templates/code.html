<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Your Uncloud code</title>
</head>
<body style="margin:0;padding:0;background:#F5F6F8;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;color:#1D1D1F;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F5F6F8;">
<tr><td align="center" style="padding:32px 16px;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#FFFFFF;border:1px solid rgba(0,0,0,.08);border-radius:16px;">
<tr><td align="center" style="padding:36px 32px;">
<img src="https://uncloud-api.vercel.app/assets/icon.png" width="64" height="64" alt="" style="width:64px;height:64px;border-radius:14px;display:block;margin:0 auto 16px;">
<div style="font-size:20px;font-weight:600;margin:0 0 16px;">Your Uncloud code</div>
<div style="font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:32px;font-weight:600;letter-spacing:6px;margin:0 0 20px;">{{ .Token }}</div>
<div style="font-size:15px;line-height:1.5;color:#6E6E73;margin:0 0 12px;">Enter this code in Uncloud to sign in. It expires in 10 minutes.</div>
<div style="font-size:13px;line-height:1.5;color:#6E6E73;margin:0;">If you didn’t ask for a code, you can ignore this email. Nobody can sign in without it.</div>
</td></tr>
</table>
<div style="font-size:12px;color:#6E6E73;margin-top:16px;">Uncloud · Take Your Photos Home</div>
</td></tr>
</table>
</body>
</html>
