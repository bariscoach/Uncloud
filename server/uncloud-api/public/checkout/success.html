<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex">
<title>You’re All Set — Uncloud</title>
<link rel="stylesheet" href="/assets/site.css">
</head>
<body>
<main data-app-url="uncloud://checkout/success" data-checkout-sync>
<section class="card">
<div class="seal">
<img class="icon" src="/assets/icon.png" width="64" height="64" alt="">
<svg viewBox="0 0 28 28" aria-hidden="true" focusable="false">
<circle cx="14" cy="14" r="14" fill="#34C759"/>
<path d="M8 14.5l4 4 8-8.5" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

<h1>You’re all set</h1>
<p>Your payment went through and Uncloud Plus is on.</p>
<p>Return to Uncloud to start using it.</p>
<a class="button" href="uncloud://checkout/success" data-app-button>Return to Uncloud</a>
<p class="secondary">Uncloud didn’t open? Switch to it from the Dock. Your plan shows up within a minute.</p>
<p class="secondary">A receipt is on its way to your email.</p>
</section>
</main>
<script src="/assets/return.js" defer></script>
