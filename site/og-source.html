<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Uncloud Open Graph source</title>
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #FFFFFF;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: #1D1D1F;
  }
  .wash {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 60% 80% at 22% 30%, rgba(30,111,217,.10), transparent 70%);
  }
  .row {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center; gap: 72px;
    padding: 0 110px;
  }
  .icon { width: 200px; height: 200px; border-radius: 46px; box-shadow: 0 18px 48px rgba(17,18,20,.16); flex: 0 0 auto; }
  h1 { margin: 0; font-size: 72px; line-height: 1.02; font-weight: 700; letter-spacing: -0.025em; }
  .badge {
    display: inline-block; margin-top: 28px; padding: 8px 18px; border-radius: 999px;
    background: rgba(30,111,217,.10); color: #1E6FD9; font-size: 26px; font-weight: 600;
  }
</style>
</head>
<body>
  <div class="wash"></div>
  <div class="row">
    <img class="icon" src="icon@2x.png" alt="">
    <div>
      <h1>Take Your<br>Photos Home</h1>
      <span class="badge">Free for Mac</span>
    </div>
  </div>
</body>
</html>
