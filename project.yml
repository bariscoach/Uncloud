name: Uncloud
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSET_CATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Uncloud:
    type: application
    platform: macOS
    sources:
      - path: Uncloud
        excludes:
          # photo_bridge.py is copied into the embedded runtime by "Embed icloudpd runtime".
          - "Helper/**"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Uncloud
        PRODUCT_NAME: Uncloud
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Uncloud
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Uncloud reads your photo library so it can copy your photos and videos to the folder you choose.
        CODE_SIGN_ENTITLEMENTS: Uncloud/Uncloud.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts:
      - name: Build icloudpd helper
        script: '"$SRCROOT/scripts/build-icloudpd.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts:
      - name: Embed icloudpd runtime
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Vendor/icloudpd-runtime
          - $(SRCROOT)/Uncloud/Helper/photo_bridge.py
        script: |
          set -eu
          SRC="$SRCROOT/Vendor/icloudpd-runtime"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/icloudpd-runtime"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          # Hardened runtime only with a real identity: Python loads its own extension modules,
          # and ad hoc signatures have no team ID for library validation to match.
          RUNTIME=""
          if [ "$IDENTITY" != "-" ]; then RUNTIME="--options runtime"; fi
          if [ ! -f "$SRC/.stamp" ]; then
              echo "error: $SRC is missing; run scripts/build-icloudpd.sh" >&2
              exit 1
          fi
          mkdir -p "$DEST"
          rsync -a --delete --exclude .stamp "$SRC/" "$DEST/"
          # The app's own bridge to pyicloud_ipd runs next to run_icloudpd.py. It's a plain
          # resource, sealed by the app's signature like the rest of the runtime's Python files.
          cp "$SRCROOT/Uncloud/Helper/photo_bridge.py" "$DEST/photo_bridge.py"
          INTERPRETER="$DEST/python/bin/python3.13"
          # Sign the libraries and extension modules first, then the interpreter. Only the
          # interpreter is launched, so only it gets the inherit-the-app's-sandbox entitlements.
          find "$DEST" -type f ! -path "$INTERPRETER" -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q '^Mach-O'; then
                  codesign --force --timestamp=none $RUNTIME -s "$IDENTITY" "$f"
              fi
          done
          codesign --force --timestamp=none $RUNTIME -s "$IDENTITY" \
              --entitlements "$SRCROOT/Uncloud/Helper.entitlements" "$INTERPRETER"
  UncloudTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UncloudTests
    dependencies:
      - target: Uncloud
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.UncloudTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Uncloud.app/Contents/MacOS/Uncloud"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Uncloud:
    build:
      targets:
        Uncloud: all
        UncloudTests: [test]
    test:
      targets:
        - UncloudTests
