name: Uncloud
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    ASSET_CATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    MARKETING_VERSION: "0.1.13"
    CURRENT_PROJECT_VERSION: "14"
targets:
  Uncloud:
    type: application
    platform: macOS
    info:
      path: Uncloud/App/Info.plist
      properties:
        # Versions come from the build settings, as they did before the Info.plist moved here.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The uncloud:// scheme returns from Stripe Checkout and the customer portal (AccountURL).
        CFBundleURLTypes:
          - CFBundleURLName: com.example.Uncloud.account
            CFBundleURLSchemes: [uncloud]
        UncloudAccountMode: $(UNCLOUD_ACCOUNT_MODE)
        UncloudAPIBaseURL: $(UNCLOUD_API_BASE_URL)
        UncloudSupabaseURL: $(UNCLOUD_SUPABASE_URL)
        UncloudSupabasePublishableKey: $(UNCLOUD_SUPABASE_PUBLISHABLE_KEY)
        UncloudEntitlementPublicKey: $(UNCLOUD_ENTITLEMENT_PUBLIC_KEY)
    sources: &appSources
      - path: Uncloud
        excludes:
          # photo_bridge.py is copied into the embedded runtime by "Embed icloudpd runtime".
          - "Helper/**"
          # The Info.plists are generated from the `info:` blocks below.
          - "App/*Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Uncloud
        PRODUCT_NAME: Uncloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Uncloud
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Uncloud reads your photo library so it can copy your photos and videos to the folder you choose.
        CODE_SIGN_ENTITLEMENTS: Uncloud/Uncloud.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        # The account server (Vercel) and Supabase project. Public values; only `live` reads them.
        UNCLOUD_API_BASE_URL: "https://uncloud-api.vercel.app"
        UNCLOUD_SUPABASE_URL: "https://nkcbuwuuatsbskqcqosc.supabase.co"
        # Empty until the orchestrator fills them in (publishable key from Supabase; base64 of the 32-byte public
        # half of ENTITLEMENT_SIGNING_KEY). While empty, `live` resolves to `off`, so nothing half-configured ships.
        UNCLOUD_SUPABASE_PUBLISHABLE_KEY: "sb_publishable_XIZXliAMljBaJUlJcb14FA_-sc_NF6B"
        UNCLOUD_ENTITLEMENT_PUBLIC_KEY: "qwGj6tPobumIR5fSh4CXbICwpAgc/KeFeDkiZ/O5zhE="
      configs:
        Debug:
          # Debug runs `preview`. Launch with `-UncloudAccountMode live` (scheme argument) to use the test backend.
          UNCLOUD_ACCOUNT_MODE: "preview"
        Release:
          # Until the server exists, release builds have no accounts: the app is exactly the free build.
          UNCLOUD_ACCOUNT_MODE: "off"
    preBuildScripts: &preBuildScripts
      - name: Build icloudpd helper
        script: '"$SRCROOT/scripts/build-icloudpd.sh"'
        basedOnDependencyAnalysis: false
    postCompileScripts: &postCompileScripts
      - name: Embed icloudpd runtime
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/Vendor/icloudpd-runtime
          - $(SRCROOT)/Uncloud/Helper/photo_bridge.py
        script: |
          set -eu
          SRC="$SRCROOT/Vendor/icloudpd-runtime"
          DEST="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/icloudpd-runtime"
          IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}"
          # Hardened runtime only with a real identity: Python loads its own extension modules,
          # and ad hoc signatures have no team ID for library validation to match.
          RUNTIME=""
          if [ "$IDENTITY" != "-" ]; then RUNTIME="--options runtime"; fi
          if [ ! -f "$SRC/.stamp" ]; then
              echo "error: $SRC is missing; run scripts/build-icloudpd.sh" >&2
              exit 1
          fi
          mkdir -p "$DEST"
          rsync -a --delete --exclude .stamp "$SRC/" "$DEST/"
          # The app's own bridge to pyicloud_ipd runs next to run_icloudpd.py. It's a plain
          # resource, sealed by the app's signature like the rest of the runtime's Python files.
          cp "$SRCROOT/Uncloud/Helper/photo_bridge.py" "$DEST/photo_bridge.py"
          INTERPRETER="$DEST/python/bin/python3.13"
          # Sign the libraries and extension modules first, then the interpreter. Only the
          # interpreter is launched, so only it gets the inherit-the-app's-sandbox entitlements.
          find "$DEST" -type f ! -path "$INTERPRETER" -print0 | while IFS= read -r -d '' f; do
              if file -b "$f" | grep -q '^Mach-O'; then
                  codesign --force --timestamp=none $RUNTIME -s "$IDENTITY" "$f"
              fi
          done
          codesign --force --timestamp=none $RUNTIME -s "$IDENTITY" \
              --entitlements "$SRCROOT/Uncloud/Helper.entitlements" "$INTERPRETER"
  # The host the unit tests run in. It compiles the same sources as Uncloud, under the same module name
  # (so `@testable import Uncloud` works), but with its own bundle identifier: its sandbox container,
  # UserDefaults and Keychain access are separate from the real app's.
  UncloudTestHost:
    type: application
    platform: macOS
    # No CFBundleURLTypes here: a test build must not register uncloud:// and take the scheme from the real app.
    info:
      path: Uncloud/App/TestHost-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UncloudAccountMode: "preview"
    sources: *appSources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Uncloud.TestHost
        PRODUCT_NAME: UncloudTestHost
        PRODUCT_MODULE_NAME: Uncloud
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Uncloud Test Host"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.photography
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Uncloud reads your photo library so it can copy your photos and videos to the folder you choose.
        CODE_SIGN_ENTITLEMENTS: Uncloud/Uncloud.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
    preBuildScripts: *preBuildScripts
    postCompileScripts: *postCompileScripts
  UncloudTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: UncloudTests
    dependencies:
      - target: UncloudTestHost
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.UncloudTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/UncloudTestHost.app/Contents/MacOS/UncloudTestHost"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Uncloud:
    build:
      targets:
        # Not built for the test action: the app and the test host both define module Uncloud, and
        # their module outputs would collide in the products folder if one run built both.
        Uncloud: [build, run, profile, archive, analyze]
        UncloudTestHost: [test]
        UncloudTests: [test]
    test:
      targets:
        - UncloudTests
